<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>❤️Xem bói tình yêu❤️</h2>
    <label for="">Nhập tên bạn</label>
    <input type="text" id="Tenban">
    <br>
    <label for="">Nhập tên người ấy</label>
    <input type="text" id="Tennguoiay">
    <br><br>
    <button onclick="xemBoi()">Xem kết quả</button>
    <h3 id="ketqua"></h3>

    <script>
        function xemBoi() {
            let tenBan = document.getElementById("Tenban").value;
            let tenNguoiAy = document.getElementById("Tennguoiay").value;
            let diem = Math.floor(Math.random() *100) + 1;
            if (diem > 50){
                document.getElementById("ketqua").innerHTML =
                Tenban + "💕" + tenNguoiAy +".Diem: " + diem +".Chúc mừng. Hai bạn rất hợp";
            }else{
            document.getElementById("ketqua").innerHTML =
            Tenban + "💔" + tenNguoiAy +".Diem: " + diem +".Chia tay sớm bớt đau khổ";
            }
        }
    </script>
</body>
</html>
