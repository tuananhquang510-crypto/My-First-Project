<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Quay thưởng may mắn</h2>
    <button onclick="quayThuong()">Quay thưởng</button>
    <p id="ketqua"></p>

    <script>
        function quayThuong(){
            let thuong = ['Cộng 1 điểm', 'Trừ 1 điểm', 'Cộng 2 điểm', 'Trừ 2 điểm', '10 điểm', '9 điểm'];
            let NgauNhien = Math.floor(Math.random() * thuong.length);
            document.getElementById("ketqua").innerHTML = "Kết quả quay thưởng: " + thuong[NgauNhien];
        }
    </script>
</body>
</html>
