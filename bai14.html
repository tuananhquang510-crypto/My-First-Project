<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tính chỉ số BMI</h2>
    <label for="">Nhập chiều cao (m)</label>
    <input type="number" id="chieucao" step="0.01">
    <br>
    <label for="">Nhập cân nặng (kg)</label>
    <input type="number" id="cannang" step="0.1">
    <br> <br>
    <button onclick="tinhBMI()">Tính BMI</button>
    <p id="ketqua"></p>

    <script>
        function tinhBMI(){
            let chieucao = document.getElementById("chieucao").value;
            let cannang = document.getElementById("cannang").value;
            let bmi = cannang / (chieucao * chieucao);
            if (bmi < 18.5){
                document.getElementById("ketqua").innerHTML = "Chỉ số BMI của bạn là: " + bmi.toFixed(2) + " (Thiếu cân)";
            } else if (bmi >= 18.5 && bmi < 24.9){
                document.getElementById("ketqua").innerHTML = "Chỉ số BMI của bạn là: " + bmi.toFixed(2) + " (Bình thường)";
            } else if (bmi >= 25 && bmi < 29.9){
                document.getElementById("ketqua").innerHTML = "Chỉ số BMI của bạn là: " + bmi.toFixed(2) + " (Thừa cân)";
            } else {
                document.getElementById("ketqua").innerHTML = "Chỉ số BMI của bạn là: " + bmi.toFixed(2) + " (Béo phì)";
            }
        }
    </script>
</body>
</html>
