<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registration Form</h2>
    <table>
        <form>
            <tr>
                <td>
                    <label for ="first name">First Name: </label>
                </td>
                <td>
                    <input id="first name" type="text" placeholder="Enter Your First Name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="last name">Last Name: </label>
                </td>
                <td>
                    <input id="last name" type="text" placeholder="Enter Your Last Name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Email">Email: </label>
                </td>
                <td>
                    <input type="text" placeholder="Enter Your Email" id="Email">
                </td>
            </tr>
            <tr>
                <td><label for="password">Password: </label></td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>
                    <label for="">Gender: </label> <br>
                </td>
                <td>
                    <label><input name="role" type="radio">Male</label> <br>
                    <label><input name="role" type="radio">Female</label> <br>
                    <label><input name="role" type="radio">Other</label> <br>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Age: </label>
                </td>
                <td>
                    <input type="number">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Preferences: </label>
                </td>
                <td>
                    <label><input name="role" type="checkbox">Acrylic Painting</label> <br>
                    <label><input name="role" type="checkbox">Oil Painting</label> <br>
                    <label><input name="role" type="checkbox">Water Color Painting</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Select Occupation</label>
                </td>
                <td>
                    <select>
                        <option>Student</option>
                        <option>Teacher</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Bio</td>
                <td><textarea placeholder="Share few lines about yourself..."></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="SUBMIT">
                    <input type="reset" value="RESET">
                </td>
            </tr>
        </form>
    </table>
</body>
</html>
